prompt: |
  Pixel art game background, 16:9, seen from the sea looking at a Caribbean port in the 1660s. Crisp hard-edged pixels, flat colour areas with a little hand-placed dithering, no anti-aliasing, no blur, no gradients across large areas, no film grain, no bloom. A limited palette of about 40 colours: deep navy and teal sea blues, jungle and palm greens, sand and ochre, terracotta and brick reds, weathered wood browns, warm greys for stone, pale cream for plaster. Soft even midday light from the upper left, gentle shadows. Calm, inviting, adventurous mood. Painterly detail in the buildings and foliage, readable at small size. No text, no letters, no signs with writing, no logos, no watermark, no UI, no frame or border, no people in close-up.

  Keep the composition of the attached reference image exactly: same horizon height, same quay line, same positions for the town, the fort and the flagpole, same open water in the bottom third. The flagpole stays bare: no flag. Leave the open water in the lower middle and lower right empty: no ships, no boats, no reflections of ships there (the game draws the player's ship at anchor). Repaint everything in the style described, with far richer detail than the reference.

  A French colonial port town: pale plaster and timber Creole houses with wooden galleries, tall shutters and red-brown and slate-blue hip roofs, a church with a slender spire, a stone warehouse on the quay with barrels of rum and sugar, a low stone fort on the right, palms and green hills behind.
