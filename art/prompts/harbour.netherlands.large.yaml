  A wealthy Dutch colonial capital: dense rows of tall stepped-gable and bell-gable brick merchant houses in red, ochre and brown with white window frames, a big brick church with a tall spire, a governor's house with a classical gable, brick city walls, a large brick and stone fort with a tall keep on the right, a busy quay with warehouses and cranes, palms and green mountains behind.
