prompt: |
  Pixel art game background, 16:9, an interior scene in the Caribbean in the 1660s. Crisp hard-edged pixels, flat colour areas with a little hand-placed dithering, no anti-aliasing, no blur, no gradients across large areas, no film grain, no bloom. A limited palette of about 40 colours: deep navy and teal sea blues, jungle and palm greens, sand and ochre, terracotta and brick reds, weathered wood browns, warm greys for stone, pale cream for plaster. Soft even midday light from the upper left, gentle shadows. Calm, inviting, adventurous mood. Painterly detail in the buildings and foliage, readable at small size. No text, no letters, no signs with writing, no logos, no watermark, no UI, no frame or border, no people in close-up.
  
  The panel covers the middle of the picture, so keep the centre calm and fairly dark and put the detail at the left and right edges.
  
  A money-lender's counting room: a heavy iron-bound strongbox and a scale for coin on a long table, ledgers on shelves, a barred window, a guard's halberd leaning in the corner, candlelight.
