<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 13px/1.4 system-ui, sans-serif; }
      canvas { display: block; }
      #panel { position: fixed; top: 8px; left: 8px; padding: 8px 10px; background: rgba(10, 18, 30, 0.78); color: #e8eef5; border-radius: 6px; display: grid; gap: 6px; max-width: 260px; }
      #panel.hidden { display: none; }
      #panel label { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
      #panel button { font: inherit; }
      #panel input[type='range'] { width: 130px; }
      #stats { font-variant-numeric: tabular-nums; opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <script type="module" src="/src/lab.ts"></script>
  </body>
</html>
